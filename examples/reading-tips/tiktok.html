<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles/themes/clean.css">
<link rel="stylesheet" href="../../styles/base.css">
<style>
  .page { background: var(--fg); color: var(--bg); }
  .safe { display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
  .tag { font-size: var(--fs-small); font-weight: 600; color: var(--accent); letter-spacing: .08em; }
  h1 { font-size: 112px; margin-top: 40px; letter-spacing: -.02em; }
  h1 span { display: block; white-space: nowrap; }
  h1 em { font-style: normal; color: var(--accent); }
  .big4 { position: absolute; right: -120px; bottom: 260px; font-family: var(--font-num); font-weight: 900; font-size: 1500px; line-height: .75;
          color: #23232A; letter-spacing: -.06em; }
  .hint { margin-top: 64px; font-size: 40px; color: #9A9AA3; }
</style></head>
<body data-size="tiktok">
  <section class="page">
    <div class="big4 deco">4</div>
    <div class="safe">
      <div class="tag">READING · 方法论</div>
      <h1><span>读完就忘？</span><span>试试这 <em>4</em> 个方法</span></h1>
      <p class="hint">往左滑 →</p>
    </div>
  </section>
