<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles/themes/editorial.css">
<link rel="stylesheet" href="../../styles/base.css">
<style>
  .cover { padding: var(--pad); display: flex; flex-direction: column; }
  .issue { display: flex; justify-content: space-between; font-family: var(--font-head); font-style: italic; font-size: var(--fs-small);
           color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 20px; }
  .cover h1 { font-size: var(--fs-hero); font-family: "Noto Serif SC", serif; margin-top: auto; line-height: 1.15; }
  .cover .sub { margin-top: 48px; font-size: var(--fs-h2); color: var(--muted); font-weight: 400; }
  .cover .sub b { color: var(--accent); font-weight: 600; }

  .one { padding: var(--pad); display: flex; flex-direction: column; justify-content: center; }
  .one .n { font-family: var(--font-num); font-style: italic; font-size: 360px; line-height: .9; color: var(--accent); }
  .one h2 { font-family: "Noto Serif SC", serif; font-size: var(--fs-h1); margin-top: 24px; }
  .one hr { border: 0; border-top: 1px solid var(--accent); width: 160px; margin: 56px 0; }
  .one p { font-size: 44px; line-height: 1.7; color: var(--muted); max-width: 820px; }
  .one .pg { position: absolute; bottom: 72px; right: var(--pad); font-family: var(--font-head); font-style: italic; color: var(--muted); font-size: var(--fs-small); }
</style></head>
<body data-size="xhs">
  <section class="page cover">
    <div class="issue"><span>On Reading</span><span>No. 04</span></div>
    <h1>读完<br>就忘？</h1>
    <p class="sub">四个方法，让书真正<b>留下来</b>。</p>
  </section>
  <section class="page one">
    <div class="n">03</div>
    <h2>读完 24 小时内，<br>讲给别人听。</h2>
    <hr>
    <p>讲不出来的地方，就是没懂的地方。复述会逼你把零散的印象，重新组织成自己的话。</p>
    <div class="pg">3 / 4</div>
  </section>
</body></html>
