<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles/themes/editorial.css">
<link rel="stylesheet" href="../../styles/base.css">
<style>
  .page { display: grid; grid-template-columns: 560px 1fr; padding: 90px 110px; gap: 80px; align-items: center; }
  .left h1 { font-family: "Noto Serif SC", serif; font-size: 110px; line-height: 1.15; }
  .left p { margin-top: 36px; font-size: 34px; color: var(--accent); font-style: italic; font-family: var(--font-head); }
  ol { list-style: none; border-left: 1px solid var(--line); padding-left: 64px; }
  li { display: flex; gap: 32px; align-items: baseline; padding: 22px 0; font-size: 38px; }
  li .n { font-family: var(--font-num); font-style: italic; color: var(--accent); font-size: 48px; width: 64px; }
</style></head>
<body data-size="x">
  <section class="page">
    <div class="left"><h1>读完<br>就忘？</h1><p>Four ways to make books stick.</p></div>
    <ol>
      <li><span class="n">01</span>先看目录再读正文</li>
      <li><span class="n">02</span>每章写一句话总结</li>
      <li><span class="n">03</span>24 小时内讲给别人听</li>
      <li><span class="n">04</span>只挑一个点马上用</li>
    </ol>
  </section>
</body></html>
