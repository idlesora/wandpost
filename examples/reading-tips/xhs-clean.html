<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles/themes/clean.css">
<link rel="stylesheet" href="../../styles/base.css">
<style>
  .cover { padding: var(--pad); display: flex; flex-direction: column; }
  .tag { font-size: var(--fs-small); font-weight: 600; color: var(--accent); letter-spacing: .08em; }
  .cover h1 { font-size: 104px; margin-top: 48px; letter-spacing: -.02em; }
  .cover h1 span { display: block; white-space: nowrap; }
  .cover h1 em { font-style: normal; color: var(--accent); }
  .big4 { font-family: var(--font-num); font-weight: 900; font-size: 560px; line-height: .8; color: var(--accent);
          position: absolute; right: 60px; bottom: 80px; letter-spacing: -.06em; }
  .cover .foot { margin-top: auto; font-size: var(--fs-small); color: var(--muted); border-top: 2px solid var(--fg); padding-top: 28px; width: 420px; }

  .list { padding: var(--pad); display: flex; flex-direction: column; }
  .list h2 { font-size: var(--fs-h2); }
  .list ol { list-style: none; margin-top: 56px; flex: 1; display: flex; flex-direction: column; }
  .list li { flex: 1; display: grid; grid-template-columns: 120px 1fr; align-content: center; padding: 40px 0; border-top: 2px solid var(--line); }
  .list li:last-child { border-bottom: 2px solid var(--line); }
  .list .n { font-family: var(--font-num); font-weight: 900; font-size: 72px; line-height: 1; color: var(--accent); }
  .list b { display: block; font-size: 46px; font-weight: 900; margin-bottom: 10px; }
  .list p { color: var(--muted); font-size: 34px; line-height: 1.5; }
</style></head>
<body data-size="xhs">
  <section class="page cover">
    <div class="tag">READING · 方法论</div>
    <h1><span>读完就忘？</span><span>试试这 <em>4</em> 个方法</span></h1>
    <div class="big4 deco">4</div>
    <div class="foot">记住的不是你读过的，<br>是你用过的。</div>
  </section>
  <section class="page list">
    <h2>4 个方法，越往后越重要</h2>
    <ol>
      <li><span class="n">01</span><div><b>先看目录再读正文</b><p>花 5 分钟搞清楚作者要回答什么问题。</p></div></li>
      <li><span class="n">02</span><div><b>边读边写一句话总结</b><p>每章读完，用一句话写下它讲了什么。</p></div></li>
      <li><span class="n">03</span><div><b>24 小时内讲给别人听</b><p>讲不出来的地方，就是没懂的地方。</p></div></li>
      <li><span class="n">04</span><div><b>只挑一个点马上用</b><p>一本书能改变你一个习惯，就已经值了。</p></div></li>
    </ol>
  </section>
</body></html>
